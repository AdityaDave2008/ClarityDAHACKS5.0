plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.myeyes.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.myeyes.sample'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [allowCleartext: 'false']
    }

    buildTypes {
        debug {
            // Local laptop API only. Release builds require HTTPS.
            manifestPlaceholders = [allowCleartext: 'true']
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Camera2, HTTP, JSON, notifications, and the UI use Android platform APIs.
// No third-party app libraries or embedded/fake detector are needed.
